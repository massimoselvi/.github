name: Feature request
description: Propose a new capability or a change to existing behavior.
title: "feat: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the proposal. For a large change, agree on the approach in this issue before you open a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you want to solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions or workarounds that you considered.
    validations:
      required: false
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      description: Do you want to implement this change?
      options:
        - "Yes, I can open a pull request"
        - "No, I am only proposing it"
    validations:
      required: true
