name: Question
description: Ask how to use the project. Use Discussions instead if the repository enables them.
title: "question: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to do, and what did you try?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Version or commit, environment, and links to the documentation that you read.
    validations:
      required: false
