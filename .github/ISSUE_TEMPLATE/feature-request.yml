name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Thanks for taking the time to propose an improvement. Please fill out the sections below so we can understand and evaluate your request.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the feature or enhancement you would like to see.
      placeholder: Describe the feature you are proposing.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain the problem this feature solves and who benefits from it. What are you trying to accomplish?
      placeholder: Describe the use case or problem this feature addresses.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: If you have an idea of how this could be implemented, describe it here.
      placeholder: Describe your proposed solution.
    validations:
      required: false
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
      placeholder: Describe any alternatives you have considered.
    validations:
      required: false
